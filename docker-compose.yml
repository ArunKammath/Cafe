services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: "1234"
      MONGO_URI: mongodb://mongo:27017/Cafe
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build: ./FrontEnd
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
